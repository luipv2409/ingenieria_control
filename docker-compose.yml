version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: vacunas_mariadb
    restart: unless-stopped
    environment:
      TZ: America/La_Paz
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: punata_vacuna_segura
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - red-vacunas
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vacunas_web
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      TZ: America/La_Paz
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: punata_vacuna_segura
      DB_USER: root
      DB_PASS: root
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-ludwinggunnarpv24@gmail.com}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM:-ludwinggunnarpv24@gmail.com}"
    volumes:
      - ./web:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-vacunas

networks:
  red-vacunas:
    driver: bridge

volumes:
  db_data:

